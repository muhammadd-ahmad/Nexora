services:
  - type: web
    name: nexora-vulnscan-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SCAN_API_KEY
        generateValue: true
      - key: ALLOWED_TARGETS
        sync: false
      - key: DATA_DIR
        value: /tmp/nexora-data
